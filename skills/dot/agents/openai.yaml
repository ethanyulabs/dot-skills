interface:
  display_name: "dot"
  short_description: "个人工具箱：dot photo 照片风格处理（风格分析、人像磨皮、风景层次、打印 / web / 交友软件导出，支持整个文件夹批量）；dot browser 用 Arc（指定空间、复用登录态）或 dot 自己的 Chrome / Edge 实例打开网页、读取 / 点击 / 填写 / 截图，不打扰当前浏览"
  default_prompt: "Use $dot <subcommand>: $dot photo processes the photo I give you (style, retouch, exports); $dot browser opens and works a page in my browser (Arc in the space I name, or Chrome / Edge)."
